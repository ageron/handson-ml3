name: Run end-to-end notebook

on:
  pull_request:
    paths:
      - 'ML_Tutorial_End_to_End.ipynb'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=600 ML_Tutorial_End_to_End.ipynb
